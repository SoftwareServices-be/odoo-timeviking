<!doctype html>
<!-- Source of static/description/banner.png (560x280, the cover image in the Odoo Apps store).
     {{...}} comes from product.json; brand/ holds the TimeViking wordmark. Render with tools/render_assets.py.
     Palette: Fjord #16202e, Staal #2f6fb0, Koper #a8491a. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:560px;height:280px;overflow:hidden;background:#16202e;

.text{position:absolute;left:28px;top:30px;width:258px}
.brand img{display:block;height:30px}
h1{font-size:21px;line-height:1.2;margin:14px 0 10px;font-weight:700}
p{font-size:11.5px;line-height:1.45;color:#c9d3e0;margin:0}
.pill{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.pill span{font-size:10px;border:1px solid #3a4a60;border-radius:20px;padding:3px 9px;color:#e5eaf1}
.pill span.on{background:#a8491a;border-color:#a8491a;color:#fff}
.cal{position:absolute;right:28px;top:34px}
</style></head><body><div class="wrap">
<div class="text">
  <div class="brand"><img src="brand/timeviking-woordmerk-donker.svg" alt="{{PRODUCT_NAME}}"></div>

  <p>Log hours in a visual week calendar on web or phone. Export to Excel and PDF. Schedules and time off included.</p>
  <div class="pill"><span class="on">Free connector</span><span>Odoo 18 · 19 · 20</span><span>Community &amp; Enterprise</span></div>
</div>
