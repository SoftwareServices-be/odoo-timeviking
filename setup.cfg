[flake8]
# The module follows the Odoo code style; long lines are allowed for readable SQL, domains and messages.
max-line-length = 170
extend-ignore = E127
exclude = .git,__pycache__,dist
per-file-ignores =
    # __init__.py files only import
    src/*/__init__.py:F401
    src/*/*/__init__.py:F401

[tool:pytest]
testpaths = tests
